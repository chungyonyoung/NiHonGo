<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我们一起学日语！</title>
    <style>
        :root {
            /* 莫兰迪色盘 */
            --bg-color: #F2F4F6;
            --card-bg: #FFFFFF;
            --text-main: #2C3E50;
            --text-sub: #95A5A6;
            
            /* 功能色 */
            --color-forget: #E5989B;       /* 忘记 */
            --color-blurry: #E5C498;       /* 模糊 */
            --color-remember: #83BCA9;     /* 记住 */
            
            --theme-blue: #8CA8D8;
            --theme-dark: #6D8498;
            
            --shadow: 0 10px 25px rgba(0,0,0,0.06);
            --btn-shadow: 0 4px 12px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Meiryo", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- 首页 (菜单) --- */
        #home-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 25px;
            animation: fadeIn 0.4s;
        }

        .home-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .menu-card {
            width: 100%;
            max-width: 340px;
            padding: 30px 20px;
            background: white;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .menu-card:active { transform: scale(0.98); }
        .menu-card:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }

        .menu-icon { font-size: 2.5rem; margin-right: 15px;}
        .menu-info { text-align: left; flex: 1; }
        .menu-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; color: var(--text-main); }
        .menu-desc { font-size: 0.85rem; color: var(--text-sub); }

        /* --- 学习界面 --- */
        #app-screen {
            display: none;
            flex-direction: column;
            height: 100%;
            animation: slideIn 0.3s;
        }

        header {
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            background-color: var(--bg-color);
            z-index: 10;
        }

        .header-group { display: flex; gap: 10px; align-items: center; }

        .progress-wrapper {
            flex: 1;
            margin: 0 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .progress-text {
            font-size: 0.7rem;
            color: var(--text-sub);
            margin-bottom: 4px;
            text-align: center;
        }
        .progress-track {
            height: 6px;
            background-color: #E0E0E0;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: var(--color-remember);
            width: 0%;
            transition: width 0.4s;
        }

        .btn-icon {
            background: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            color: var(--text-main);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .btn-icon:active { transform: scale(0.9); }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            padding: 20px;
            position: relative;
        }

        .card-container {
            width: 100%;
            max-width: 360px;
            aspect-ratio: 3/4.2;
            max-height: 560px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            cursor: pointer;
        }
        .card-container.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 24px;
            background-color: var(--card-bg);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.8);
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #fff 0%, #f9fbfd 100%);
        }

        /* 内容样式 */
        .content-main {
            font-weight: bold;
            color: var(--text-main);
            line-height: 1.5;
            margin: 20px 0;
            word-wrap: break-word;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .content-sub {
            color: var(--theme-blue);
            font-weight: 500;
        }

        .label-tag {
            position: absolute;
            top: 25px;
            font-size: 0.8rem;
            color: #999;
            background: #F0F0F0;
            padding: 4px 12px;
            border-radius: 12px;
        }

        /* 针对不同类型的特殊样式 */
        .type-kana .content-main { font-size: 7rem; line-height: 1; } 
        .type-vocab .content-main { font-size: 3.5rem; } 
        .type-sentence .content-main { font-size: 1.6rem; overflow-y: auto; max-height: 60%; } 

        .click-hint {
            position: absolute;
            bottom: 30px;
            font-size: 0.8rem;
            color: var(--text-sub);
            opacity: 0.6;
        }

        /* 详情列表 (背面) */
        .info-grid { width: 100%; background: #F8F9FA; border-radius: 12px; padding: 15px; margin-top: 10px; }
        .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #E0E0E0; font-size: 0.95rem; }
        .info-row:last-child { border-bottom: none; }
        .tip-box { width: 100%; background: rgba(159, 177, 165, 0.15); border-radius: 12px; padding: 12px; margin-top: auto; margin-bottom: 10px; text-align: left; font-size: 0.9rem; color: #5C7A5C; }

        /* 底部控制栏 */
        .controls {
            padding: 0 20px 40px;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .btn-show {
            width: 100%; max-width: 280px; padding: 16px;
            background-color: var(--text-main); color: white;
            border: none; border-radius: 50px;
            font-size: 1.1rem; font-weight: bold;
            box-shadow: var(--btn-shadow); cursor: pointer;
        }

        .grade-actions {
            display: none; width: 100%; max-width: 360px;
            justify-content: space-between; gap: 12px;
        }
        
        .btn-grade {
            flex: 1; padding: 12px 0;
            border: none; border-radius: 16px;
            color: white; font-weight: bold; font-size: 1rem;
            cursor: pointer; box-shadow: var(--btn-shadow);
            display: flex; flex-direction: column; align-items: center;
        }
        .btn-grade span { font-size: 0.75rem; opacity: 0.85; margin-top: 3px;}
        .btn-forget { background-color: var(--color-forget); }
        .btn-blurry { background-color: var(--color-blurry); color: #5C4F30; }
        .btn-remember { background-color: var(--color-remember); }

        .finished-state { text-align: center; display: none; }
        .finished-icon { font-size: 5rem; margin-bottom: 20px; display: block;}

        /* 列表弹窗 */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.98); z-index: 100;
            display: none; flex-direction: column; animation: fadeIn 0.2s;
        }
        .modal-header { padding: 15px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;}
        .word-list { flex: 1; overflow-y: auto; padding: 0 20px 40px; }
        
        /* 列表项样式优化：改为垂直排列以适应长句子 */
        .list-item { 
            padding: 12px 0; 
            border-bottom: 1px solid #f5f5f5; 
            display: flex; 
            flex-direction: column; 
            align-items: flex-start; 
            gap: 5px;
        }
        .list-top { font-weight: bold; color: var(--text-main); font-size: 1rem; }
        .list-bottom { color: var(--theme-dark); font-size: 0.9rem; font-family: "Hiragino Sans", sans-serif; }

        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
        @keyframes slideIn { from{transform: translateX(50px); opacity: 0;} to{transform: translateX(0); opacity: 1;} }
    </style>
</head>
<body>

    <div id="home-screen">
        <div class="home-title">我们一起学日语！</div>
        
        <div class="menu-card" onclick="startApp('vocab')">
            <div class="menu-icon">📖</div>
            <div class="menu-info">
                <div class="menu-title">单词训练</div>
                <div class="menu-desc">看汉字 → 写假名 </div>
            </div>
        </div>

        <div class="menu-card" onclick="startApp('kana')">
            <div class="menu-icon">🈂️</div>
            <div class="menu-info">
                <div class="menu-title">假名特训</div>
                <div class="menu-desc">平假名 → 片假名</div>
            </div>
        </div>

        <div class="menu-card" onclick="startApp('sentence')">
            <div class="menu-icon">🗣️</div>
            <div class="menu-info">
                <div class="menu-title">句子翻译</div>
                <div class="menu-desc">中文 → 日文 </div>
            </div>
        </div>
    </div>

    <div id="app-screen">
        <header>
            <div class="header-group">
                <button class="btn-icon" onclick="goHome()" title="返回主页">🏠</button>
                <button class="btn-icon" onclick="toggleMode()" id="modeBtn" title="切换模式">📂</button>
                <button class="btn-icon" onclick="resetProgress()" style="color: var(--color-forget);" title="重置">↻</button>
            </div>
            
            <div class="progress-wrapper">
                <div class="progress-text" id="progressText">0 / 0</div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressBar"></div>
                </div>
            </div>

            <div class="header-group">
                <button class="btn-icon" onclick="undo()" title="撤销">↩</button>
                <button class="btn-icon" onclick="toggleList()">☰</button>
            </div>
        </header>

        <main>
            <div class="finished-state" id="finishScreen">
                <span class="finished-icon">🎉</span>
                <h2>本轮学习完成</h2>
                <button class="btn-show" onclick="resetProgress()" style="background: var(--theme-blue); margin-top:30px;">重新开始</button>
            </div>

            <div class="card-container" id="card" onclick="flipCard()">
                <div class="card-face">
                    <div class="label-tag" id="labelFront">题目</div>
                    <div class="content-main" id="contentFront"></div>
                    <div class="click-hint">点击查看答案</div>
                </div>
                <div class="card-face card-back">
                    <div class="label-tag" style="background:#eee;" id="labelBack">答案</div>
                    <div id="backContainer" style="width:100%; display:flex; flex-direction:column; align-items:center;">
                        </div>
                </div>
            </div>
        </main>

        <div class="controls">
            <button class="btn-show" id="showBtn" onclick="flipCard()">查看答案</button>
            <div class="grade-actions" id="gradeBtns">
                <button class="btn-grade btn-forget" onclick="handleGrade('forget', event)">忘记<span>(3张后)</span></button>
                <button class="btn-grade btn-blurry" onclick="handleGrade('blurry', event)">模糊<span>(稍后)</span></button>
                <button class="btn-grade btn-remember" onclick="handleGrade('remember', event)">记住<span>(完成)</span></button>
            </div>
        </div>
    </div>

    <div class="modal" id="listModal">
        <div class="modal-header">
            <h3>数据一览</h3>
            <button class="btn-icon" onclick="toggleList()">×</button>
        </div>
        <div class="word-list" id="wordListContainer"></div>
    </div>

            // 重置状态
            isFlipped = false;
            cardContainer.classList.remove('flipped');
            showBtn.style.display = 'block';
            gradeBtns.style.display = 'none';
            
            // 清理旧类名
            cardContainer.className = 'card-container'; 
            cardContainer.classList.add(`type-${currentDeckType}`);

            // 渲染正面
            if (currentDeckType === 'vocab') {
                labelFront.textContent = item.theme;
                contentFront.textContent = item.kanji;
            } else if (currentDeckType === 'kana') {
                labelFront.textContent = "平假名";
                contentFront.textContent = item.hira;
            } else if (currentDeckType === 'sentence') {
                labelFront.textContent = `#${item.id} 中文`;
                fitText(contentFront, item.cn, '1.6rem');
            }

            // 渲染背面 (延迟以防透视)
            setTimeout(() => {
                backContainer.innerHTML = ''; // 清空背面
                
                if (currentDeckType === 'vocab') {
                    labelBack.textContent = "详情";
                    backContainer.innerHTML = `
                        <div class="content-sub" style="font-size:2rem; margin-bottom:10px;">${item.kana}</div>
                        <div class="info-grid">
                            <div class="info-row"><span>意思</span><span style="font-weight:bold;">${item.mean}</span></div>
                            <div class="info-row"><span>词性</span><span>${item.pos}</span></div>
                        </div>
                        <div class="tip-box">💡 ${item.tip}</div>
                    `;
                } else if (currentDeckType === 'kana') {
                    labelBack.textContent = "片假名";
                    backContainer.innerHTML = `
                        <div class="content-main" style="font-size:7rem; color:var(--theme-blue); margin:0;">${item.kata}</div>
                        <div style="font-size:1.5rem; color:#999; font-family:Arial;">${item.roma}</div>
                    `;
                } else if (currentDeckType === 'sentence') {
                    labelBack.textContent = "日文";
                    backContainer.innerHTML = `
                        <div class="content-main" style="color:var(--theme-blue); font-size:1.4rem;">${item.jp}</div>
                    `;
                }
            }, 150);
        }

        // 翻转
        function flipCard() {
            if (isFlipped) return;
            isFlipped = true;
            cardContainer.classList.add('flipped');
            showBtn.style.display = 'none';
            gradeBtns.style.display = 'flex';
        }

        // 评分逻辑
        function handleGrade(grade, event) {
            if (event) event.stopPropagation();
            const current = studyQueue.shift();
            
            historyStack.push({ card: current, grade: grade });
            if (historyStack.length > 5) historyStack.shift();

            if (grade === 'remember') masteredCount++;
            else if (grade === 'blurry') studyQueue.push(current);
            else if (grade === 'forget') {
                let idx = Math.min(studyQueue.length, 3);
                studyQueue.splice(idx, 0, current);
            }

            updateProgress();
            renderCard();
        }

        // 撤销
        function undo() {
            if (historyStack.length === 0) { alert("无操作可撤销"); return; }
            const action = historyStack.pop();
            
            if (action.grade === 'remember') masteredCount--;
            if (action.grade !== 'remember') {
                const idx = studyQueue.findIndex(i => i.id === action.card.id);
                if (idx > -1) studyQueue.splice(idx, 1);
            }
            
            studyQueue.unshift(action.card);
            updateProgress();
            renderCard();
        }

        function updateProgress() {
            let total = 0;
            if(currentDeckType === 'vocab') total = vocabData.length;
            if(currentDeckType === 'kana') total = kanaRaw.length;
            if(currentDeckType === 'sentence') total = sentencesRaw.length;

            progressText.textContent = `${masteredCount} / ${total}`;
            const percent = total > 0 ? (masteredCount / total) * 100 : 0;
            progressBar.style.width = `${percent}%`;
        }

        // 模式切换
        function toggleMode() {
            if(studyQueue.length < 2) return;
            isShuffled = !isShuffled;
            modeBtn.textContent = isShuffled ? "🎲" : "📂";
            
            const current = studyQueue.shift();
            if (isShuffled) {
                for (let i = studyQueue.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [studyQueue[i], studyQueue[j]] = [studyQueue[j], studyQueue[i]];
                }
            } else {
                studyQueue.sort((a, b) => a.id - b.id);
            }
            studyQueue.unshift(current);
            renderCard();
        }

        function resetProgress() {
            if(confirm("重置将清空当前模块进度，确定吗？")) {
                startApp(currentDeckType);
            }
        }

        // 列表
        function toggleList() {
            const modal = document.getElementById('listModal');
            modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
        }

        // 列表生成逻辑 (修复了句子部分只显示“查看日语”的问题)
        function generateList() {
            const container = document.getElementById('wordListContainer');
            let html = '';
            
            let data = [];
            if(currentDeckType === 'vocab') data = vocabData;
            if(currentDeckType === 'kana') data = kanaRaw.map((k,i)=>({hira:k[0], kata:k[1], roma:k[2]}));
            if(currentDeckType === 'sentence') data = sentencesRaw;

            data.forEach(item => {
                let top = '', bottom = '';
                
                // 根据类型生成不同的列表内容
                if(currentDeckType === 'vocab') { 
                    top = item.kanji; 
                    bottom = `${item.kana} / ${item.mean}`; 
                }
                if(currentDeckType === 'kana') { 
                    top = `${item.hira} → ${item.kata}`; 
                    bottom = item.roma; 
                }
                if(currentDeckType === 'sentence') { 
                    // 句子特训：第一行中文，第二行日文
                    top = `${item.id}. ${item.cn}`; 
                    bottom = item.jp; 
                }
                
                html += `
                    <div class="list-item">
                        <div class="list-top">${top}</div>
                        <div class="list-bottom">${bottom}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

    </script>
</body>
</html>
